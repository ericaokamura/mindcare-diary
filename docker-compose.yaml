services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-26ai
    restart: unless-stopped

    ports:
      - "1521:1521"

    environment:
      ORACLE_PWD: "12345678"
      ORACLE_CHARACTERSET: AL32UTF8

    volumes:
      - oracle-data:/opt/oracle/oradata

    shm_size: 1g

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  oracle-data: