services:

  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-26ai

    ports:
      - "1521:1521"

    environment:
      ORACLE_PWD: ${DB_PASSWORD}
      ORACLE_CHARACTERSET: AL32UTF8

    volumes:
      - oracle-data:/opt/oracle/oradata

    networks:
      - mindcare-network


volumes:
  oracle-data:


networks:
  mindcare-network:
    name: mindcare-network
    driver: bridge